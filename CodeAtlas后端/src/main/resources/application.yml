server:
  address: 127.0.0.1
  port: ${CODEATLAS_PORT:8080}
  error:
    include-message: never
spring:
  datasource:
    url: ${CODEATLAS_DB_URL:jdbc:mysql://127.0.0.1:3306/codeatlas?useUnicode=true&characterEncoding=UTF-8&serverTimezone=UTC}
    username: ${CODEATLAS_DB_USER:root}
    password: ${CODEATLAS_DB_PASSWORD:}
    hikari:
      maximum-pool-size: 5
  jackson:
    serialization:
      write-dates-as-timestamps: false
  servlet:
    multipart:
      enabled: false
codeatlas:
  ai:
    url: ${CODEATLAS_AI_URL:http://127.0.0.1:8001}
    service-token: ${CODEATLAS_AI_SERVICE_TOKEN:}
    timeout-seconds: ${CODEATLAS_AI_TIMEOUT:70}
  data: ${CODEATLAS_DATA:./data}
  allowed-roots: ${CODEATLAS_ALLOWED_ROOTS:}
  allowed-origin: ${CODEATLAS_DEV_ORIGIN:http://127.0.0.1:5173}
  github:
    timeout-seconds: ${CODEATLAS_GITHUB_TIMEOUT:180}
